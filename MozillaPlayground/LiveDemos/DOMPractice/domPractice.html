<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple DOM example</title>
    <style>
        .highlight{
            color: white;
            background-color: black;
            padding: 10px;
            width: 250px;
            text-align: center;
            line-height: 1.5;
            font-style: italic;
            font-family: 'Arial Narrow Bold', sans-serif;
            font-size: 17px;
        }
    </style>
  </head>
  <body>
      <section>
        <img src="dinosaur.png" alt="A red Tyrannosaurus Rex: A two legged dinosaur standing upright like a human, with small arms, and a large head with lots of sharp teeth.">
        <p>Here we will add a link to the <a href="https://www.mozilla.org/">Mozilla homepage</a></p>
      </section>
      <script>
        const link = document.querySelector("a");
        link.textContent="Mozilla Developer Network";
        link.target = "_blank";
        link.href="https://developer.mozilla.org";
        const section = document.querySelector("section");
        const extension = document.createElement('p');
        extension.textContent = "We hope you enjoyed the ride";
        section.appendChild(extension);
        const linkPara = document.querySelector("p");
        //Adding nodes
        const txt = document.createTextNode("---The premier source for web development knowledge");
        linkPara.appendChild(txt);

        //Moving nodes
        //section.append(link);
        txt.parentNode.removeChild(txt);
        linkPara.setAttribute("class", "highlight");
        linkPara.appendChild(txt);
      </script>
  </body>
</html>
