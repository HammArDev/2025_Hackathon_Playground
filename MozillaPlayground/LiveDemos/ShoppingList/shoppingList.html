<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Shopping List</title>
        <meta name="author" content="Mozilla Developer Team & Ham Sandwhich">
        <meta name="description" content="Did you remember a grocery item while at work, or want to segregate your digital shopping list from your brick-and-mortar supermarket list? Fear not, you can use our tool to easily keep track of all your wants and needs">
        <meta name="viewport" content="width=device-width">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="shoppingList.css">
    </head>
    <body>
        <h1>Shopping List</h1>
        <section class="input">
            <input type="text" minlength="2" placeholder="Item goes here..." id="new-item">
            <button type="submit" id="add-button">Add Item</button>
        </section>
        <section class="output">
            <ul class="list">
            </ul>
        </section>
        <script src="shoppingList.js"></script>
    </body>
</html>
